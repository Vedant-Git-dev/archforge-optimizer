[project]
name = "archforge"
dynamic = ["version"]
description = "ArchForge — a self-improving meta-layer over multi-agent systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

# The installed console command — the package STILL imports as `archforge`
# (a hyphenated name can't be imported), but the binary the user runs is
# `archforge-optimizer`. `python -m archforge` keeps working via __main__.py.
[project.scripts]
archforge-optimizer = "archforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.11",
]
# Real LLM providers — install only the one(s) you run. None are required to
# import or test the package; adapters import lazily and self-skip when absent.
providers-anthropic = ["anthropic>=0.40"]
providers-openai = ["openai>=1.40"]
providers-groq = ["groq>=0.11"]
providers-gemini = ["google-genai>=1.0"]
providers = [
    "anthropic>=0.40",
    "openai>=1.40",
    "groq>=0.11",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth: the package version is read from archforge.config
# (renamed from constants.py), and is also re-exported as `archforge.__version__`.
# Edit VERSION there only.
path = "archforge/config.py"
pattern = 'VERSION:\s*str\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["archforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run EXCLUDES the opt-in `smoke` marker (real, billed LLM calls).
# Run them explicitly with:  python -m pytest -m smoke
# (the user-passed `-m smoke` overrides this `-m "not smoke"`).
addopts = "-ra -m 'not smoke'"
pythonpath = ["."]
markers = [
    "smoke: opt-in real-LLM smoke tests (make live, billed API calls; not run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
