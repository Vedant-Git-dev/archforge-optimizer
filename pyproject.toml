[project]
name = "archforge-optimizer"
dynamic = ["version"]
description = "ArchForge: a self-improving meta-layer over multi-agent systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "litellm",
]

# The installed console command: the package still imports as `archforge`
# (a hyphenated name can't be imported), but the binary the user runs is
# `archforge-optimizer`. 
[project.scripts]
archforge-optimizer = "archforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.11",
]
# Real LLM providers: install only the one(s) you run. None are required to
# import or test the package; LiteLLM shells out to these SDKs at call time.
providers-anthropic = ["anthropic>=0.40"]
providers-openai = ["openai>=1.40"]
providers-groq = ["groq>=0.11"]
providers-gemini = ["google-genai>=1.0"]
providers = [
    "anthropic>=0.40",
    "openai>=1.40",
    "groq>=0.11",
    "google-genai>=1.0",
]

deepeval = ["deepeval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "archforge/config.py"
pattern = 'VERSION:\s*str\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["archforge"]

[tool.hatch.build.targets.sdist]
include = [
    "archforge",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not smoke'"
pythonpath = ["."]
markers = [
    "smoke: opt-in real-LLM smoke tests (make live, billed API calls; not run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
